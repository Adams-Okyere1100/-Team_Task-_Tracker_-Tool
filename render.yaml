services:
  - type: web
    name: team-task-tracker-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run db:setup && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: team-task-tracker-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGINS
        sync: false

databases:
  - name: team-task-tracker-db
    databaseName: team_task_tracker
    user: team_task_tracker